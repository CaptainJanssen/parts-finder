<style>
.plate { padding-top: env(safe-area-inset-top, 0px); }
body.booting > :not(#boot) { display: none !important; }
.boot { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--panel); box-sizing: border-box; }
.bootcard { width: min(400px, 100%); background: var(--surface); color: var(--ink); border-radius: 14px; padding: 24px 22px; box-shadow: 0 10px 40px rgba(0,0,0,.3); box-sizing: border-box; }
.boottitle { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .16em; font-size: 15px; margin-bottom: 16px; }
.bootnote { margin: 0 0 14px; color: var(--muted); }
.bootform { display: grid; gap: 12px; }
.bootform .field { display: grid; gap: 4px; }
.bootform .field input { width: 100%; box-sizing: border-box; font-size: 16px; }
.booterr { color: #b3261e; margin: 0; font-size: 14px; }

<style>
/* Layout: lightplate-grey header with two views (catalogue, warehouse) over one working column; details and forms open in a side sheet. */
:root {
  --bg: #e8ebed;
  --surface: #f9fafa;
  --surface-2: #eff2f3;
  --ink: #1a2025;
  --muted: #59646c;
  --line: #d2d8dc;
  --panel: #3a434a;
  --panel-ink: #f2efe4;
  --panel-muted: #b8c0c5;
  --amber: #9a5800;
  --amber-bg: #fdf0d5;
  --amber-lamp: #f0a623;
  --good: #1d7444;
  --good-bg: #e2f2e8;
  --bad: #b3261e;
  --bad-bg: #fbe5e3;
  --focus: #1f6aa8;
  --shadow: 0 10px 40px rgba(20, 28, 34, .18);
  --f-display: "Jost", "Futura", "Century Gothic", "Trebuchet MS", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a1d; --surface: #1f2529; --surface-2: #252c31; --ink: #e5e8e9; --muted: #9aa5ac; --line: #313a40;
    --panel: #2b3237; --panel-ink: #f2efe4; --panel-muted: #9da6ab;
    --amber: #f2ab3c; --amber-bg: #3a2b12; --amber-lamp: #f0a623;
    --good: #62c792; --good-bg: #17301f; --bad: #ff8b80; --bad-bg: #3a1a17; --focus: #74b6ff; --shadow: 0 10px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a1d; --surface: #1f2529; --surface-2: #252c31; --ink: #e5e8e9; --muted: #9aa5ac; --line: #313a40;
  --panel: #2b3237; --panel-ink: #f2efe4; --panel-muted: #9da6ab;
  --amber: #f2ab3c; --amber-bg: #3a2b12; --amber-lamp: #f0a623;
  --good: #62c792; --good-bg: #17301f; --bad: #ff8b80; --bad-bg: #3a1a17; --focus: #74b6ff; --shadow: 0 10px 40px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* touch screens: the page keeps its size (no pinch or double-tap zoom, no larger text after turning the iPad); the drawing viewer zooms by itself */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; touch-action: pan-x pan-y; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; }

/* Header: lightplate */
.plate { background: var(--panel); color: var(--panel-ink); position: relative; }
.plate .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; padding-block: 12px; flex-wrap: wrap; }
.plate::before, .plate::after { content: ""; position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #8a949b, #4a535a); transform: translateY(-50%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
.plate::before { left: 6px; } .plate::after { right: 6px; }
.plate h1 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 19px; letter-spacing: .16em; text-transform: uppercase; }
.brand { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; min-width: 0; }
.acbtn { display: inline-flex; align-items: center; gap: 10px; border: 1px solid rgba(242,239,228,.35); background: rgba(0,0,0,.22); color: var(--panel-ink); border-radius: 6px; padding: 5px 6px 5px 11px; cursor: pointer; font-family: var(--f-display); font-size: 14px; letter-spacing: .06em; }
.acbtn:hover { border-color: var(--panel-ink); }
.acbtn .acname { font-weight: 600; }
.acbtn .acchg { font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--panel-muted); background: rgba(255,255,255,.08); padding: 2px 7px; border-radius: 4px; }
.headright { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tabs { display: flex; gap: 3px; background: rgba(0,0,0,.22); padding: 3px; border-radius: 8px; }
.tab { border: 0; background: transparent; color: var(--panel-muted); font-family: var(--f-display); text-transform: uppercase; letter-spacing: .12em; font-size: 13px; padding: 7px 13px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.tab:hover { color: var(--panel-ink); }
.tab[aria-selected="true"] { background: var(--panel-ink); color: #2b3237; }
.tab .n { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0; opacity: .8; }
.listbtn { display: inline-flex; align-items: center; gap: 10px; background: transparent; border: 1px solid rgba(242,239,228,.35); color: var(--panel-ink); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-family: var(--f-display); letter-spacing: .1em; text-transform: uppercase; font-size: 13px; }
.listbtn:hover { border-color: var(--panel-ink); }
.lamp { min-width: 26px; padding: 1px 7px; border-radius: 3px; background: #4a3a1c; color: #c8a46a; font-family: var(--f-mono); font-size: 12px; text-align: center; }
.lamp.on { background: var(--amber-lamp); color: #2a1a00; box-shadow: 0 0 12px rgba(240,166,35,.55); }
.syncbtn { position: relative; gap: 7px; }
.syncbtn svg { width: 15px; height: 15px; flex: none; }
.syncdot { position: absolute; top: -4px; right: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--amber-lamp); box-shadow: 0 0 8px rgba(240,166,35,.6); }
.synclast { font-size: 13px; color: var(--muted); margin: 0 0 10px; }

/* Aircraft picker */
.pickgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; padding-block: 28px 36px; }
.pickcard { position: relative; display: grid; gap: 4px; align-content: start; text-align: left; padding: 18px 18px 16px; min-height: 168px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; color: var(--ink); }
.pickcard:hover { border-color: var(--muted); box-shadow: 0 4px 18px rgba(20, 28, 34, .08); }
.pickcard.last { border-color: var(--focus); }
.pickcard .maker { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .16em; font-size: 11.5px; color: var(--muted); }
.pickcard .type { font-family: var(--f-display); font-weight: 500; font-size: 30px; letter-spacing: .02em; line-height: 1.1; }
.pickcard .sub { font-size: 13px; color: var(--muted); }
.pickcard .figs { margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.pickcard .figs b { color: var(--ink); font-family: var(--f-mono); font-weight: 600; }
.pickcard .lastused { position: absolute; top: 14px; right: 14px; font-size: 11px; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .12em; color: var(--focus); }
.pickcard.all { background: var(--surface-2); border-style: dashed; }
.pickcard.all .type { font-size: 24px; }
.tag.ac { border-color: color-mix(in srgb, var(--focus) 45%, transparent); color: var(--focus); }
.acchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

/* Search */
.searchzone { padding-block: 20px 6px; display: grid; gap: 10px; }
.searchbox { position: relative; flex: 1; min-width: 0; }
.searchrow { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.bigbtn { font-size: 16px; padding: 0 20px; border-radius: 10px; min-height: 52px; }
.searchbox svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.bigsearch { width: 100%; font-size: 18px; padding: 15px 44px 15px 48px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); }
.bigsearch::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.bigsearch:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.clearq { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; width: 34px; height: 34px; border-radius: 6px; cursor: pointer; }
.clearq:hover { background: var(--surface-2); }
.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 700; }
.savestate { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.live { background: var(--good); }
.dot.warn { background: var(--amber-lamp); }
.banner { padding: 10px 12px; border-radius: 8px; background: var(--amber-bg); border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent); font-size: 14px; }

/* Filters */
.filters { display: grid; gap: 10px; padding-block: 8px 12px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13.5px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: baseline; }
.chip small { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .75; }
.chip:disabled { opacity: .45; cursor: default; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; }
.tools label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.tools select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
.filters > *, .tools label { min-width: 0; max-width: 100%; }
@media (max-width: 760px) { .tools select { max-width: calc(100vw - 150px); } }
.toolstoggle { display: none; }
/* Phones: a compact header, the search box stays at the top while the page scrolls,
   and the filter and export controls fold away behind one button */
@media (max-width: 760px) {
  .plate .wrap { padding-block: 8px; gap: 8px; }
  .plate h1 { font-size: 13px; letter-spacing: .14em; white-space: nowrap; }
  .hidephone { display: none; }
  .tab, .listbtn, .acbtn { white-space: nowrap; }
  .plate h1 { font-size: 12px; letter-spacing: .1em; flex: none; }
  .acbtn { min-width: 0; flex: 0 1 auto; }
  .acbtn .acname { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .acbtn .acchg { display: none; }
  .brand { width: 100%; justify-content: space-between; flex-wrap: nowrap; }
  .acbtn { padding: 3px 4px 3px 9px; font-size: 13px; }
  .headright { width: 100%; justify-content: space-between; flex-wrap: nowrap; gap: 6px; }
  .tab { padding: 6px 10px; font-size: 12px; letter-spacing: .08em; }
  .listbtn { padding: 6px 9px; font-size: 12px; letter-spacing: .06em; gap: 6px; }
  .fixedtop { display: contents; }
  .searchzone { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 10px 6px; gap: 6px; }
  .bigsearch { padding: 11px 40px 11px 42px; }
  .stats { font-size: 12px; gap: 2px 12px; }
  .tools.collapsible:not(.open) > :not(.toolstoggle) { display: none; }
  .toolstoggle { display: inline-flex; }
  .tools.open .toolstoggle { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tiles { padding-block: 12px 0; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile { padding: 8px 10px; }
  .tile .v { font-size: 17px; }
  .pickgrid { padding-block: 16px 28px; }
  .pickcard { min-height: 0; padding: 14px; }
  .pickcard .type { font-size: 24px; }
}
.tools .spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

/* Results */
.results { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: clip; margin-bottom: 28px; }
/* the column headings stay in view while the list scrolls */
.rhead, .shead { position: sticky; top: 0; z-index: 2; }
/* On a computer screen the search, filters and headings stay put and only the list scrolls.
   Phones keep normal page scrolling, where a fixed top would leave too little room for the list. */
@media (min-width: 761px) and (min-height: 520px) {
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .plate { flex: none; }
  main.wrap { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; }
  #topbanner { flex: none; }
  .view { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .fixedtop { flex: none; }
  .scrollbox, .pickview { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
  .scrollbox .results { margin-bottom: 16px; }
  .filters { padding-bottom: 10px; }
}

/* Phones: the header with the tabs stays at the top, clear of the phone's status bar; everything below it scrolls,
   and the search box stays in view under the header */
@media (max-width: 760px), (max-height: 519px) {
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; height: 100dvh; }
  .plate { flex: none; z-index: 6; }
  main.wrap { flex: 1 1 auto; min-height: 0; width: 100%; box-sizing: border-box; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom, 0px); }
}

.rhead, .row { display: grid; grid-template-columns: minmax(150px, 1.1fr) minmax(0, 3fr) 96px 96px 104px 84px; gap: 12px; align-items: center; padding: 10px 14px; }
.rhead, .shead { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .12em; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.rhead .r, .shead .r { text-align: right; }
.row, .srow { border-bottom: 1px solid var(--line); cursor: pointer; }
.row:last-child, .srow:last-child { border-bottom: 0; }
.row:hover, .srow:hover { background: var(--surface-2); }
.row.sel { background: color-mix(in srgb, var(--focus) 9%, var(--surface)); }
.c-pn { display: flex; align-items: center; gap: 4px; min-width: 0; }
.pn { font-family: var(--f-mono); font-weight: 600; font-size: 14.5px; letter-spacing: .01em; word-break: break-all; }
.copy { border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 4px; width: 26px; height: 26px; display: inline-grid; place-items: center; flex: none; }
.copy:hover { background: var(--line); color: var(--ink); }
.copy svg { width: 14px; height: 14px; }
.c-desc { min-width: 0; }
.desc { font-weight: 700; overflow-wrap: anywhere; }
.ctx { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.fits { font-size: 13px; margin-top: 3px; overflow-wrap: anywhere; }
.fits .fitl { font-family: var(--f-display); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
.listedas { margin-top: 2px; font-size: 12.5px; }
.listedas span { color: var(--muted); }
.tag { display: inline-block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin-right: 6px; color: var(--muted); font-family: var(--f-display); vertical-align: 1px; }
.tag.ref { border-color: var(--amber); color: var(--amber); }
.tag.unit { border-color: color-mix(in srgb, var(--ink) 35%, transparent); color: var(--ink); }
.tag.instock { border-color: color-mix(in srgb, var(--good) 50%, transparent); color: var(--good); background: var(--good-bg); }
.price { width: 100%; text-align: right; border: 1px solid transparent; background: var(--surface-2); border-radius: 5px; padding: 6px 8px; font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: 13.5px; }
.price:hover { border-color: var(--line); }
.price:focus { border-color: var(--focus); outline: none; background: var(--surface); }
.price::placeholder { color: color-mix(in srgb, var(--muted) 60%, transparent); }
.price[readonly] { background: transparent; }
.c-margin { text-align: right; font-family: var(--f-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.c-margin small { display: block; font-size: 11.5px; color: var(--muted); }
.pos { color: var(--good); } .neg { color: var(--bad); }
.c-act { text-align: right; }
.addlist { border: 1px solid var(--line); background: transparent; border-radius: 5px; padding: 4px 8px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.addlist:hover { border-color: var(--muted); }
.addlist.on { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); font-weight: 700; }
.more { display: flex; justify-content: center; gap: 12px; align-items: center; padding: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13.5px; flex-wrap: wrap; }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); }
.empty h3 { color: var(--ink); font-family: var(--f-display); font-weight: 500; letter-spacing: .04em; margin: 0 0 6px; }
.hiddenhint { padding: 9px 14px; font-size: 13.5px; background: var(--amber-bg); color: var(--ink); border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; color: var(--focus); text-decoration: underline; cursor: pointer; padding: 0; text-align: left; }

/* Warehouse */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; padding-block: 20px 6px; }
#tiles { grid-template-columns: repeat(3, minmax(0, 200px)); }
@media (max-width: 760px) { #tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tilebtn { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.tilebtn .k, .tilebtn .v { display: block; }
.tilebtn:hover:not(:disabled) { border-color: var(--muted); }
.tilebtn[aria-pressed="true"] { border-color: var(--focus); box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 22%, transparent); }
.tilebtn:disabled { cursor: default; }
.tilebtn.todo { border-color: color-mix(in srgb, var(--amber) 55%, var(--line)); background: var(--amber-bg); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.tile .k { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: var(--muted); }
.tile .v { font-family: var(--f-mono); font-size: 21px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .s { font-size: 12.5px; color: var(--muted); }
.shead, .srow { display: grid; grid-template-columns: minmax(0, 2.4fr) 118px 46px minmax(0, 1fr) minmax(0, .9fr) 96px 96px 92px; gap: 12px; align-items: center; padding: 10px 14px; }
.srow .c-qty { text-align: right; font-family: var(--f-mono); font-weight: 600; }
.srow .c-money { text-align: right; font-family: var(--f-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.srow .c-money small { display: block; color: var(--muted); font-size: 11.5px; }
.srow .c-txt { overflow-wrap: anywhere; font-size: 14px; }

function scoreEntry(e, clauses) {
  let total = 0, worst = 0;
  for (const c of clauses) {
    let best = 0, kind = 3;
    if (c.raw === e.p) { best = 1000; kind = 0; }
    else if (c.raw.length >= 2 && e.p.startsWith(c.raw)) { best = 420; kind = 1; }
    else if (c.comp && c.comp.length >= 3 && e.pnC.startsWith(c.comp)) { best = 380; kind = 1; }
    else if (c.raw.length >= 3 && e.pnAll.includes(c.raw)) { best = 260; kind = 1; }
    else if (c.comp && c.comp.length >= 4 && e.pnAllC.includes(c.comp)) { best = 220; kind = 1; }
    if (best < 60) {
      for (const a of c.alts) {
        const m = a.test(e.dS);
        if (m) { const s = (m === 2 ? (e.dS.startsWith(a.s) ? 70 : 55) : 40) + (a.s === c.raw ? 5 : 0); if (s > best) { best = s; kind = 2; } }

        else if (best < 32 && a.test(e.descU)) { best = 32; kind = e.tier >= 5 ? 3 : 2; }

/* ---------- Catalogue filtering ---------- */
let lastResults = [];
// seat and side words: many parts are one part number for every seat and the IPC names no seat for them
// (Airbus audio control panels, 747 audio panels), so a search that finds nothing is retried without these words
const SEAT_WORDS = new Set(["CAPT", "CAPTAIN", "CAPTAINS", "CAPTS", "FO", "F/O", "FIRST OFFICER", "FIRST OFFICERS", "COPILOT", "PILOT", "PILOTS",
  "OBSERVER", "OBSERVERS", "JUMPSEAT", "LEFT", "RIGHT", "LH", "RH", "3RD", "4TH"]);
function compute() {
  let clauses = parseQuery(S.q);
  const hasQ = clauses.length > 0;
  const scan = (cl) => {
    const out = [];
    for (const e of P) {
      if (S.ac && e.ac !== S.ac) continue;
      if (S.sec && !e.secs.has(S.sec)) continue;
      if (S.priced) { const r = prices.get(e.p); if (!r || (r.buy == null && r.sell == null)) continue; }
      if (S.inStock) { const st = stockByPn.get(e.p); if (!st || !(st.stock + st.reserved)) continue; }
      let sc = { score: 0, group: 2 };
      if (cl.length) { sc = scoreEntry(e, cl); if (!sc) continue; }
      out.push([e, sc]);
    }
    return out;
  };
  let base = scan(clauses);
  let relaxed = null;
  const shown = (b) => b.filter(([e]) => (S.cat ? e.c === S.cat : !(S.hideHw && e.c === "hw"))).length;
  if (hasQ && !shown(base)) {
    const rest = clauses.filter((c) => !SEAT_WORDS.has(c.raw));
    if (rest.length && rest.length < clauses.length) {
      const again = scan(rest);
      if (shown(again)) {
        relaxed = clauses.filter((c) => SEAT_WORDS.has(c.raw)).map((c) => c.raw);
        // the captain sits left and the first officer right: that side's version first
        const side = relaxed.some((w) => /^(CAPT|CAPTAIN|CAPTAINS|CAPTS|PILOT|LEFT|LH)$/.test(w)) ? /\((?:LH|L\/H)\)|\bLH\b|\bLEFT\b/
          : relaxed.some((w) => /^(FO|F\/O|FIRST OFFICERS?|COPILOT|RIGHT|RH)$/.test(w)) ? /\((?:RH|R\/H)\)|\bRH\b|\bRIGHT\b/ : null;
        base = side ? again.map(([e, sc]) => [e, side.test(e.dS) ? { ...sc, score: sc.score + 100 } : sc]) : again;
        clauses = rest;
      }
    }
  }
  const counts = {};
  base.forEach(([e]) => { counts[e.c] = (counts[e.c] || 0) + 1; });
  let list = base;
  let hiddenHw = 0;
  const wantsHw = clauses.some((c) => (c.pnish && c.raw.length >= 5 && !/^P\d+(-\d+)?$/.test(c.raw)) || HW_WORDS.has(c.raw) || HW_WORDS.has(c.raw.replace(/S$/, "")));
  if (S.cat) list = list.filter(([e]) => e.c === S.cat);
  else if (S.hideHw && !wantsHw) { hiddenHw = counts.hw || 0; list = list.filter(([e]) => e.c !== "hw"); }
  const cmpDesc = (a, b) => a[0].d.localeCompare(b[0].d) || a[0].p.localeCompare(b[0].p);
  const pnGroup = (x) => Math.min(x[1].group, 2);
  // "switch", "lightplate", "knob": the part type is asked for, so parts named that way come first;
  // otherwise ("fuel panel", "hydraulic") complete units come first
  const typeQuery = clauses.some((c) => TYPE_WORDS.has(c.raw) || TYPE_WORDS.has(c.raw.replace(/S$/, "")) || HW_WORDS.has(c.raw));
  const sorters = {
    // complete units (modules, panel assemblies, indicators) first, then switches and lights, then lightplates and other panel parts
    // a part number hit always comes first; for word searches the kind of part decides, then how directly it matched
    rel: !hasQ ? (a, b) => DEFAULT_RANK.get(a[0].idx) - DEFAULT_RANK.get(b[0].idx)
       : typeQuery ? (a, b) => a[1].group - b[1].group || a[0].tier - b[0].tier || a[0].generic - b[0].generic || b[1].score - a[1].score || cmpDesc(a, b)
       : (a, b) => pnGroup(a) - pnGroup(b) || a[0].tier - b[0].tier || a[1].group - b[1].group || a[0].generic - b[0].generic || b[1].score - a[1].score || cmpDesc(a, b),
    pn: (a, b) => a[0].p.localeCompare(b[0].p, "en", { numeric: true }),
    desc: cmpDesc,
    margin: (a, b) => (margin(rec(b[0].p))?.m ?? -Infinity) - (margin(rec(a[0].p))?.m ?? -Infinity) || cmpDesc(a, b),
    sell: (a, b) => (rec(b[0].p).sell ?? -Infinity) - (rec(a[0].p).sell ?? -Infinity) || cmpDesc(a, b),
  };
  list.sort(sorters[S.sort] || sorters.rel);
  return { list: list.map((x) => x[0]), counts, total: base.length, hiddenHw, relaxed };
}

function sfStep(kind, i, d) {
  if (!Backend.canWrite) return;
  sfKeep();
  const main = sfMain();
  if (kind === "qty") {
    if (d > 0) SF.qty = Math.min(999, SF.qty + 1);
    else if (main > 1) SF.qty--;
    else { const x = [...SF.extra].reverse().find((y) => y.n > 1); if (x) { x.n--; SF.qty--; } }
  } else if (kind === "x") {
    const x = SF.extra[i];
    if (x && d > 0 && main > 1) x.n++;
    else if (x && d < 0 && x.n > 1) x.n--;
  } else if (kind === "add") { if (main > 1) SF.extra.push({ n: 1, serial: "", loc: "", from: "", received: $("sf-received").value }); }
  else if (kind === "del") SF.extra.splice(i, 1);
  sfDraw();
}

function saveStockForm(addAnother) {
  const it = readStockForm();
  if (!it.pn) { toast("Enter a part number."); $("sf-pn").focus(); return; }
  if (!Number.isInteger(it.qty) || it.qty < 1) { toast("Set a quantity of 1 or more."); return; }
  for (const [f, id] of [["buy", "sf-buy"], ["sell", "sf-sell"], ["soldPrice", "sf-soldprice"]]) {
    if (Number.isNaN(it[f])) { toast("Enter a price like 125 or 125,50."); $(id).focus(); return; }
  }
  if (it.status === "sold" && !it.soldDate) it.soldDate = today();
  if (byPn.has(it.pn)) { const e = entryOf(it.pn, it.ac); if (!it.desc) it.desc = e.d; if (!it.ac) it.ac = e.ac; }
  // extra entries become their own stock items; entries with the same serial, location and aircraft are joined
  sfKeep();
  const where = (x) => [x.serial, x.loc, x.from, x.received].join("\u0001");
  const extra = [];
  for (const x of SF.extra) {
    const e = { n: x.n, serial: x.serial.trim(), loc: x.loc.trim(), from: x.from.trim().toUpperCase(), received: x.received || it.received };
    if (where(e) === where(it)) { it.qty += e.n; continue; }
    const same = extra.find((y) => where(y) === where(e));
    if (same) same.n += e.n; else extra.push(e);
  }
  putStock(it);
  for (const e of extra) putStock({ ...it, id: newId(), qty: e.n, serial: e.serial, loc: e.loc, from: e.from, received: e.received, created: "" });
  toast(SF.isNew || SF.isDraft ? "Added " + it.pn + " to the warehouse" : "Saved " + it.pn);
  if (addAnother) {
    const next = { ...it, id: newId(), serial: "", notes: "", condNote: "", qty: 1, status: "stock", soldPrice: null, soldDate: "", customer: "", created: "", updated: "" };
    SF = { item: normStock(next), isNew: true, returnTo: SF.returnTo, delArm: false, qty: 1, extra: [] };
    renderStockForm();
    $("sf-serial").focus();
    renderStock(); render();

  }

  closeSheets();
  renderStock(); render();
  if (back != null) openDetail(back);
}

function dismMarkKeys(keys) {

  for (const k of keys) {
    const m = /^o:([^:]+):(\d+)$/.exec(k);
    if (m) { if (!byOrder.has(m[1])) byOrder.set(m[1], new Set()); byOrder.get(m[1]).add(+m[2]); }
    else if (k.startsWith("s:")) setRec(k.slice(2), { sent: d });
  }
  byOrder.forEach((idx, id) => {
    const o = orders.get(id);
    if (o) putOrder({ ...o, lines: o.lines.map((l, i) => (idx.has(i) && l.rstate === "todo" ? { ...l, rstate: "sent", rdate: d } : { ...l })) });

function orderChange(t) {
  const d = t.dataset || {};
  const o = d.oid ? orders.get(d.oid) : null;
  if (o && d.of) { putOrder({ ...o, [d.of]: t.value.trim() }); listRefresh(); return; }
  if (o && d.olsell != null) {
    const v = parseMoney(t.value);
    if (Number.isNaN(v)) { toast("Enter a price like 125 or 125,50"); listRefresh(); return; }
    patchLine(o, +d.olsell, { sell: v }); listRefresh(); return;
  }
  if (o && d.oship) {
    const v = parseMoney(t.value);
    if (Number.isNaN(v)) { toast("Enter an amount like 25 or 25,50"); listRefresh(); return; }
    putOrder({ ...o, shipping: v }); listRefresh(); return;
  }
  if (o && d.oldesc != null) { patchLine(o, +d.oldesc, { desc: t.value.trim().slice(0, 200) }); listRefresh(); return; }
  if (o && d.olq != null) { patchLine(o, +d.olq, { qty: Math.max(1, Math.round(+t.value) || 1) }); listRefresh(); return; }
  if (d.dq) { const n = Math.max(1, Math.round(+t.value) || 1); dismEdit(d.dq, (x, kind) => (kind === "order" ? { ...x, req: n } : { ...x, qty: n })); listRefresh(); }
}

    iban: s("iban"), bic: s("bic"), holder: s("holder"), quoteNote: s("quoteNote"), invoiceNote: s("invoiceNote"),
    vatRate: n(v.vatRate, 21), payDays: n(v.payDays, 14), quoteDays: n(v.quoteDays, 30), invoiceStart: n(v.invoiceStart, 1),
    logo: /^data:image\/(png|jpeg);base64,/.test(v.logo || "") ? v.logo : "", logoW: n(v.logoW, 0), logoH: n(v.logoH, 0), at: s("at") };

const pct = (r) => String(Math.round(r * 100) / 100).replace(".", ",") + "%";

function docTotals(o) {

  const ship = o.shipping || 0;

function newInvoiceNo() {

let pdfLibP = null;
function loadPdfLib() {
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  if (!pdfLibP) pdfLibP = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "lib/pdf-lib.min.js";
    s.onload = () => (window.PDFLib ? res(window.PDFLib) : rej(new Error("no PDFLib")));
    s.onerror = () => { pdfLibP = null; rej(new Error("load failed")); };
    document.head.appendChild(s);

}

  if (C.name) doc.setAuthor(C.name);
  doc.setCreator("Cockpit Parts Finder");
  return doc.save();
}

// a logo is scaled down to at most 900 × 300 pixels before it is kept
function loadLogo(file) {
  if (!file || !/^image\/(png|jpeg)$/.test(file.type)) { toast("Choose a PNG or JPG image."); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 900 / img.width, 300 / img.height);
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.width * s)); cv.height = Math.max(1, Math.round(img.height * s));
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      let url = cv.toDataURL("image/png");
      if (url.length > 800000) { const c2 = cv.getContext("2d"); c2.globalCompositeOperation = "destination-over"; c2.fillStyle = "#fff"; c2.fillRect(0, 0, cv.width, cv.height); url = cv.toDataURL("image/jpeg", 0.9); }
      const sh = $("msgsheet");
      sh.dataset.logo = url; sh.dataset.logow = cv.width; sh.dataset.logoh = cv.height;
      const box = sh.querySelector(".logobox");
      if (box) box.innerHTML = '<img src="' + url + '" alt="Logo">';
      const lab = sh.querySelector('label[for="co-logofile"]');
      if (lab) lab.textContent = "Change logo";
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

/* ---------- Sync between the PC program and the online version ---------- */
// The two keep their own data. A sync file carries everything across; per order, stock line and price the newest change wins,
// and something deleted after its last change stays deleted. The PC program writes its file by itself
// (OneDrive\Parts Finder sync\Parts Finder sync PC.json) and loads the newest file from the online version by itself.
// ISO times; older PC records carry "2026-10-08 14:20" or "2026-10-08T14:20:00" (local time)
function tms(s) { const t = Date.parse(String(s || "").replace(/^(\d{4}-\d\d-\d\d) (\d)/, "$1T$2")); return Number.isFinite(t) ? t : 0; }
function addTomb(key) {
  const at = nowIso();
  tombs.set(key, at);
  if (Backend.saveTomb) queueWrite("t:" + key, () => Backend.saveTomb(key, at));
  syncDot();
}
function lastChange() {
  let m = tms(company.at);
  for (const o of orders.values()) m = Math.max(m, tms(o.updated));
  for (const s of stock.values()) m = Math.max(m, tms(s.updated));
  for (const r of prices.values()) m = Math.max(m, tms(r.at));
  for (const v of tombs.values()) m = Math.max(m, tms(v));
  return m;
}
// the online Sync button shows a dot while there are changes the PC does not have yet
function syncDot() {
  const d = $("syncdot");
  if (!d) return;
  if (Backend.attention) { d.hidden = !Backend.attention(); return; }
  d.hidden = !!Backend.local || !(lastChange() > tms(syncMark.saved));
}
function setSyncMark(patch) {
  syncMark = { ...syncMark, ...patch };
  try { localStorage.setItem("pf-sync", JSON.stringify(syncMark)); } catch (_) {}
  if (Backend.saveSyncMark) queueWrite("syncmark", () => Backend.saveSyncMark(syncMark));
  syncDot();
}
function buildSync() {
  return { kind: "parts-finder-sync", version: 1, from: Backend.local ? "pc" : "online", made: nowIso(),
    orders: [...orders.values()], stock: [...stock.values()], prices: Object.fromEntries(prices),
    company: { ...company }, codes: [...usedNos], deleted: Object.fromEntries(tombs) };
}
function importSync(d) {
  if (!d || d.kind !== "parts-finder-sync") throw new Error("not a sync file");
  const n = { orders: 0, stock: 0, prices: 0, removed: 0 };
  const b = { prices: {}, stock: [], stockDel: [], orders: [], ordersDel: [], deleted: {}, codes: [], company: null };
  for (const [k, at] of Object.entries(d.deleted || {})) {
    if (!/^[ops]:[A-Za-z0-9_.-]{1,60}$/.test(k) || !tms(at)) continue;
    if (tms(at) > tms(tombs.get(k))) { tombs.set(k, at); b.deleted[k] = at; }
    const id = k.slice(2);
    if (k[0] === "o" && orders.has(id) && tms(orders.get(id).updated) <= tms(at)) { orders.delete(id); b.ordersDel.push(id); n.removed++; }
    if (k[0] === "s" && stock.has(id) && tms(stock.get(id).updated) <= tms(at)) { stock.delete(id); b.stockDel.push(id); n.removed++; }
    if (k[0] === "p" && prices.has(id) && tms(prices.get(id).at) <= tms(at)) { prices.delete(id); b.prices[id] = null; n.removed++; }
  }
  const dead = (k, when) => tombs.has(k) && tms(tombs.get(k)) >= tms(when);
  if (d.company && typeof d.company === "object" && tms(d.company.at) > tms(company.at)) { company = normCompany(d.company); b.company = company; }
  for (const [pn, r] of Object.entries(d.prices || {})) {
    if (!r || typeof r !== "object" || !/^[A-Z0-9][A-Z0-9-]{0,39}$/.test(pn) || dead("p:" + pn, r.at)) continue;
    const cur = prices.get(pn);
    if (!cur || tms(r.at) > tms(cur.at)) { const x = normPrice(r); if (isEmptyRec(x)) continue; prices.set(pn, x); b.prices[pn] = x; n.prices++; }
  }
  for (const it of Array.isArray(d.stock) ? d.stock : []) {
    if (!it || !it.id || !it.pn || dead("s:" + it.id, it.updated)) continue;
    const cur = stock.get(String(it.id));
    if (!cur || tms(it.updated) > tms(cur.updated)) { const x = normStock(it); stock.set(x.id, x); b.stock.push(x); n.stock++; }
  }
  for (const o of Array.isArray(d.orders) ? d.orders : []) {
    if (!o || !o.id || dead("o:" + o.id, o.updated)) continue;
    const cur = orders.get(String(o.id));
    if (!cur || tms(o.updated) > tms(cur.updated)) {
      const x = normOrder(o); orders.set(x.id, x); b.orders.push(x); n.orders++;
      [x.no, x.invoiceNo].forEach((c) => { if (c && !usedNos.has(c)) { usedNos.add(c); b.codes.push(c); } });
    }
  }
  for (const c of new Set((Array.isArray(d.codes) ? d.codes : []).map(String))) if (/^[A-Z0-9-]{4,20}$/.test(c) && !usedNos.has(c)) { usedNos.add(c); b.codes.push(c); }
  writeSync(b);
  reindexStock(); updateListCount(); render(); renderStock();
  if (S.view === "orders" && !ordersEditing()) renderOrders();
  return n;
}
// the PC program saves the whole set in one go; the online version document by document
function writeSync(b) {
  if (Backend.applySync) { queueWrite("sync:" + Date.now() + Math.random(), () => Backend.applySync(b)); return; }
  for (const [k, at] of Object.entries(b.deleted)) if (Backend.saveTomb) queueWrite("t:" + k, () => Backend.saveTomb(k, at));
  if (Backend.reserveCode) b.codes.forEach((c) => queueWrite("c:" + c, () => Backend.reserveCode(c)));
  if (b.company) queueWrite("company", () => Backend.saveCompany(company));
  for (const pn of Object.keys(b.prices)) queueWrite("p:" + pn, () => Backend.savePrice(pn, prices.get(pn) || null));
  for (const id of [...b.stockDel, ...b.stock.map((x) => x.id)]) queueWrite("s:" + id, () => (stock.has(id) ? Backend.saveStock(stock.get(id)) : Backend.deleteStock(id)));
  for (const id of [...b.ordersDel, ...b.orders.map((x) => x.id)]) queueWrite("o:" + id, () => (orders.has(id) ? Backend.saveOrder(orders.get(id)) : Backend.deleteOrder(id)));
}
function syncSummary(n) {
  const pl = (k, w) => n[k] + " " + w + (n[k] === 1 ? "" : "s");
  const bits = [n.orders && pl("orders", "order"), n.stock && pl("stock", "stock line"), n.prices && pl("prices", "part"), n.removed && n.removed + " deleted"].filter(Boolean);
  return bits.length ? "Synced: " + bits.join(", ") : "Already up to date";
}
function whenText(at) {
  if (!at || !tms(at)) return "";
  const d = new Date(tms(at));
  return dateNl(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0")) + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function readSyncFile(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {

    try { d = JSON.parse(rd.result); } catch (_) {}

}

/* ---------- Scan parts into "To book in" ---------- */
// The camera reads barcodes (Data Matrix, QR, Code 128, Code 39, PDF417) on part labels and data plates.
// A part number that is found becomes a part to book in straight away; the same part scanned again counts one more,
// unless its serial number was scanned already. Plates without a barcode: type the number, or use the
// iPhone/iPad "Scan Text" in the field.
const SC = { open: false, stream: null, track: null, torch: false, det: null, busy: false, timer: 0, seen: new Map(), rows: [], ask: [], audio: null, flashT: 0 };
const PN_RX = "([A-Z0-9][A-Z0-9\\-\\/.]{1,39})";
const PN_TAG = new RegExp("(?:^|[\\s*,;|])(?:PART\\s*(?:NUMBER|NUMB|NBR|NO|N°|#)\\.?|PNR|PNO|MPN|P\\/N|P\\.N\\.|PN|1P)\\s*[:#.*=-]?\\s*" + PN_RX);
const SN_TAG = new RegExp("(?:^|[\\s*,;|])(?:SERIAL\\s*(?:NUMBER|NUMB|NBR|NO|N°|#)?\\.?|SER|S\\/N|S\\.N\\.|SN)\\s*[:#.*=-]?\\s*" + PN_RX.replace("{1,39}", "{0,39}"));
function knownPn(s) {
  s = String(s || "").replace(/[.,;:]+$/, "");
  if (!s) return "";
  if (byPn.has(s)) return s;
  const o0 = s.replace(/O/g, "0");                          // text read from a plate: O and 0 look alike
  if (byPn.has(o0)) return o0;
  if (/^1?P./.test(s)) { const r = s.replace(/^1?P/, ""); if (byPn.has(r)) return r; }   // "P" / "1P" in front of the number (Code 39 labels)
  return "";
}
// Handwriting and text read from a plate: letters and digits that look alike count as the same, and dashes, dots and
// spaces don't count. A number that matches one catalogue part that way is taken; otherwise the closest ones are offered.

// what a label says: { pn, sn, known, tagged, choices }
function parseLabel(raw, fuzzy) {

    .replace(/([A-Z0-9])-\s+([A-Z0-9]{1,6})(?=\s|$)/g, "$1-$2");    // "P/N 69-37320-" with the dash number stamped in a box next to it

  if (s) sn = s[1].replace(/[.,;:]+$/, "");

    for (const w of t.split(/[\s*,;|]+/)) { const k = knownPn(w); if (k && k !== sn) { known = k; break; } }
  }
  if (known) return { pn: known, sn, known: true, tagged };
  if (fuzzy) {
    const tries = pn ? [pn] : t.split(/[\s*,;|]+/).filter((w) => /\d/.test(w) && w.length >= 4 && w !== sn);
    for (const w of tries) {
      const c = nearPns(w);
      if (c.length === 1 && skel(c[0]) === skel(w)) return { pn: c[0], sn, known: true, tagged, read: w };
      if (c.length) return { pn: w, sn, known: false, tagged: true, choices: rankPns(c, t, w) };
    }
    // only the start of the number was read (a stamped dash number often isn't): the catalogue parts that start with it,
    // the ones whose description matches the words on the plate first
    const base = (pn || tries.find((w) => /\d-/.test(w)) || "").replace(/-[^-]*$/, "");
    if (skel(base).length >= 5) {

}

function scanSound(ok) {

// a part number that was read: book it in (or count one more)

  const key = lab.pn + "|" + (lab.sn || "");
  const row = SC.rows.find((r) => r.key === key && stock.has(r.id));
  if (row && lab.sn) { scanMsg(lab.pn + " · S/N " + lab.sn + " is scanned already", "bad"); scanSound(false); return; }
  if (row) {
    const it = stock.get(row.id);
    putStock({ ...it, qty: it.qty + 1 });
    row.qty = it.qty + 1;
  } else {
    const e = entryOf(lab.pn, W.ac || S.ac);
    const r = rec(lab.pn);
    const it = putStock({ id: newId(), pn: lab.pn, desc: e ? e.d : "", ac: e ? e.ac : (W.ac || S.ac || ""), qty: 1, status: "draft", cond: "AR",
      received: today(), serial: lab.sn || "", buy: r.buy ?? null, sell: r.sell ?? null });
    SC.rows.unshift({ key, id: it.id, pn: lab.pn, sn: lab.sn || "", qty: 1, known: lab.known });

  SC.ask = SC.ask.filter((a) => a.pn !== lab.pn);

function scanHandle(text, source) {

  }
  const lab = parseLabel(text, source === "typed");
  if (lab.choices) {

    SC.ask = SC.ask.filter((a) => a.pn !== lab.pn);

// Read text: the words on a data plate, read on this device (Tesseract, lib/ocr). Printed part numbers read well;

  const first = parseLabel(text, true);

    text += "\n" + (await ocrCall({ cmd: "read", image: buf2, psm: 6 }, [buf2]));

  const lab = parseLabel(text, true);
  if (lab.sn && !(lab.sn.length >= 4 && /\d.*\d/.test(lab.sn))) lab.sn = "";   // a serial number read wrongly is worse than none
  if (lab.choices) {
    SC.ask = SC.ask.filter((a) => a.pn !== lab.pn);
    SC.ask.unshift(lab); scanList(); scanSound(true);
    scanMsg("Choose the part", "ok");
    return true;
  }

async function scanReadText() {
  const v = $("sc-video"), b = $("sc-read");
  if (!v || !v.videoWidth || SC.reading) return;
  SC.reading = true;
  if (b) { b.disabled = true; b.textContent = "Reading…"; }
  scanMsg("Reading the text…");
  try {
    const text = await ocrRead(v, v.videoWidth, v.videoHeight);

  } catch (_) { scanMsg(navigator.onLine === false ? "Reading text needs the internet once" : "The text could not be read", "bad"); }

// the barcode reader: the phone's own when it has one (Android), otherwise ZXing (lib/zxing.js)
let zxingP = null;
function loadZxing() {
  if (window.ZXing) return Promise.resolve(window.ZXing);

    const s = document.createElement("script");
    s.src = "lib/zxing.js";
    s.onload = () => (window.ZXing ? res(window.ZXing) : rej(new Error("no ZXing")));
    s.onerror = () => { zxingP = null; s.remove(); rej(new Error("load failed")); };
    document.head.appendChild(s);

async function scanDecoder() {

      const want = ["data_matrix", "qr_code", "code_128", "code_39", "code_93", "pdf417", "itf", "ean_13", "upc_a"].filter((f) => have.includes(f));
      if (want.includes("data_matrix") && want.includes("code_128")) {
        const bd = new window.BarcodeDetector({ formats: want });

        return SC.det;

    catch (_) { return null; }

  if (n) toast(n + (n === 1 ? " part" : " parts") + " added to book in");

// a photo: more detail than the live picture, for small codes
function scanPhoto(file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = async () => {
    scanMsg("Reading the photo…");
    try {
      const det = await scanDecoder();
      let text = null;
      for (const f of [[1, 1], ...SC_CROPS]) { text = await det(scanGrab(img, img.naturalWidth, img.naturalHeight, f)); if (text) break; }
      if (text) scanHandle(text, "photo");
      else {
        // no barcode: read the text on the plate
        scanMsg("Reading the text…");
        const words = await ocrRead(img, img.naturalWidth, img.naturalHeight);
        if (!scanText(words, "photo")) { scanMsg("No part number found in the photo", "bad"); scanSound(false); }
      }
    } catch (_) { scanMsg("The photo could not be read", "bad"); }
    URL.revokeObjectURL(url);
  };
  img.onerror = () => { URL.revokeObjectURL(url); scanMsg("The photo could not be read", "bad"); };
  img.src = url;
}
function scanClick(t) {
  if (!SC.open) return false;
  if (t.id === "sc-done") { closeScanner(); return true; }
  if (t.id === "sc-read") { scanReadText(); return true; }
  if (t.id === "sc-torch") {
    SC.torch = !SC.torch;
    if (SC.track) SC.track.applyConstraints({ advanced: [{ torch: SC.torch }] }).catch(() => { SC.torch = false; });
    t.classList.toggle("on", SC.torch);
    return true;
  }
  const q = t.closest("[data-scqty]");
  if (q) {
    const [id, d] = q.dataset.scqty.split(":");
    const it = stock.get(id);
    if (it) { if (it.qty + +d < 1) removeStock(id); else putStock({ ...it, qty: it.qty + +d }); scanList(); renderStock(); }
    return true;
  }
  const del = t.closest("[data-scdel]");
  if (del) { const id = del.dataset.scdel; removeStock(id); SC.rows = SC.rows.filter((r) => r.id !== id); scanList(); renderStock(); return true; }
  const ask = t.closest("[data-scask]");
  if (ask) { const lab = SC.ask[+ask.dataset.scask]; if (lab) scanAdd({ pn: lab.pn, sn: lab.sn || "", known: false }); return true; }
  const pick = t.closest("[data-scpick]");
  if (pick) {
    const [i, j] = pick.dataset.scpick.split(":").map(Number);
    const a = SC.ask[i];
    if (a && a.choices[j]) { SC.ask.splice(i, 1); scanAdd({ pn: a.choices[j], sn: a.sn || "", known: true, read: a.pn }); }
    return true;
  }
  const not = t.closest("[data-scnot]");
  if (not) { SC.ask.splice(+not.dataset.scnot, 1); scanList(); return true; }
  return false;
}

// prices and notes only go into an export when it is for your own use
function exportRows(entries, mode, withPrices) {
  return entries.map((e) => {
    const r = rec(e.p);
    const o = e.o[0];
    const f = FIGS[o[0]];
    const mg = margin(r);
    const row = { "Part number": e.p, "Description": e.d };
    row["Aircraft"] = mode === "list" ? acsOf(e.p).map(acName).join(", ") : acName(e.ac);
    if (mode === "list") row["Qty wanted"] = r.qty || 1;
    Object.assign(row, {
      "Category": e.tier === 1 ? "Complete unit" : CAT[e.c],
      "Alternate part numbers": (e.a || []).join(", "),
      "Used in": e.mainParent,
      "IPC figure": f[0],
      "IPC item": o[1],
      "IPC section": f[2] + " " + secTitle(e.ac, f[2]),
    });
    if (withPrices) {
      row["Buy price (EUR)"] = r.buy ?? "";
      row["Sell price (EUR)"] = r.sell ?? "";
      row["Margin (EUR)"] = mg ? Math.round(mg.m * 100) / 100 : "";
      row["Note"] = r.note || "";
    }
    return row;
  });
}
